<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disappear.</p>
    </header>

    <main>
        <section id="add-section">
            <h2>Add a note</h2>

            <form id="note-form">
                <label for="note-input">Note</label>
                <input type="text" id="note-input" placeholder="Type a note..." autocomplete="off">

                <label for="note-category" class="visually-hidden">Category</label>
                <select id="note-category">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section id="notes-section">
            <h2>Your notes</h2>

            <label for="search-input" class="visually-hidden">Search notes</label>
            <input type="search" id="search-input" placeholder="Search notes...">

            <p id="note-count"></p>
            <ul id="notes-list"></ul>

            <button type="button" id="clear-all" class="clear-all-btn">Clear all</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>

</body>
</html>
